[RollingStockRoadTransport]
# Version 1.0.0 public release: unified weight/length rolling-stock eligibility + native railway-depot route-advance transfer.

enabled=1
allow_wagons=1
allow_locomotives=1
allow_train_depot_dropoff=1

# Enables the byte-validated execution-time gates that allow rail wagons and
# locomotives to reach the vehicle pickup pipeline.
enable_loading_path_patches=1

# Apply the same native 0.66 carried-vehicle longitudinal scale to wagons in
# the real attachment routine that locomotives and road vehicles already use.
enable_actual_load_wagon_scale=1

# 1 = rolling-stock transport eligibility is based ONLY on:
#     - total empty weight <= the selected carrier's payload limit
#     - native total rail length (including linked parts), at the game's 0.66
#       carried scale, <= the carrier's usable longitudinal deck length
#     Width, height and vanilla 3D vehicle-carrier class restrictions cannot
#     reject a wagon/locomotive after these two checks pass.
# 0 = fall back to the base game's full 3D carried-vehicle fit behaviour.
rail_fit_length_weight_only=1

# Rebuild the exact route "Vehicle type selection" popup for road vehicle
# carriers. Current-year availability is preserved. Every currently available
# top-level wagon/locomotive that passes the SAME weight+length rule used by
# real customs pickup is included dynamically.
picker_show_all_fitting_rolling_stock=1

# When the game's route processor is about to advance away from a railway depot
# stop, transfer carried rolling stock into that depot using the game's native
# depot-row insertion routine. This is the proven v0.3.6+ event-driven path.
enable_triggered_train_depot_unload=1

# Retained for backwards-compatible INI parsing; current builds do not use a
# timed polling/retry loop for depot arrival detection.
triggered_unload_retry_ticks=60

# Disabled by default. Diagnostics are hard-capped to avoid log spam.
debug_logging=0
debug_trace_limit=20
